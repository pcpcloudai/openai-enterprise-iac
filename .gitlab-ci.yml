# Generated by Dedale: deploys the Terraform in terraform/ (see PIPELINE.md for the CI/CD variables).
stages:
  - validate
  - plan
  - apply
  - destroy

variables:
  TF_ROOT: "terraform"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  DEPLOY_REF: "/^develop$/"

# No duplicate pipeline for a branch that has an open merge request.
workflow:
  rules:
    - if: "$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS"
      when: never
    - when: always

.terraform_base:
  image:
    name: "hashicorp/terraform:1.16.4"
    entrypoint: [""]
  before_script:
    - cd "$TF_ROOT"

# GitLab-managed Terraform state, one per environment (TF_STATE_NAME).
.terraform_backend:
  variables:
    TF_HTTP_ADDRESS: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}"
    TF_HTTP_LOCK_ADDRESS: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}/lock"
    TF_HTTP_UNLOCK_ADDRESS: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}/lock"
    TF_HTTP_USERNAME: "gitlab-ci-token"
    TF_HTTP_PASSWORD: "${CI_JOB_TOKEN}"
    TF_HTTP_LOCK_METHOD: "POST"
    TF_HTTP_UNLOCK_METHOD: "DELETE"
    TF_HTTP_RETRY_WAIT_MIN: "5"

# Cloud access through GitLab OIDC: short-lived tokens, no stored credentials.
.terraform_cloud:
  extends: [.terraform_base, .terraform_backend]
  id_tokens:
    ARM_OIDC_TOKEN:
      aud: "$CI_SERVER_URL"
  variables:
    ARM_USE_OIDC: "true"
    ARM_USE_CLI: "false"
  before_script:
    - |
      for variable_name in ARM_CLIENT_ID ARM_TENANT_ID ARM_SUBSCRIPTION_ID
      do
        eval "variable_value=\${$variable_name:-}"
        if [ -z "$variable_value" ]; then
          echo "ERROR: $variable_name is missing or unavailable in this pipeline (see PIPELINE.md)."
          exit 1
        fi
      done
    - cd "$TF_ROOT"

terraform_validate:
  extends: .terraform_base
  stage: validate
  script:
    - "terraform fmt -check -recursive"
    - "terraform init -backend=false"
    - "terraform validate"

terraform_plan_dev:
  extends: .terraform_cloud
  environment:
    name: "dev"
  stage: plan
  variables:
    TF_STATE_NAME: "dev"
  script:
    - "terraform init -reconfigure"
    - "terraform plan -out=tfplan"
    - "terraform show -no-color tfplan > tfplan.txt"
  artifacts:
    name: "tfplan-dev-${CI_COMMIT_REF_SLUG}"
    paths:
      - "$TF_ROOT/tfplan"
      - "$TF_ROOT/tfplan.txt"
      - "$TF_ROOT/.terraform.lock.hcl"
    expire_in: 1 day
  needs:
    - terraform_validate
  rules:
    - if: "$CI_COMMIT_REF_NAME !~ $DEPLOY_REF"
      when: never
    - when: on_success

terraform_apply_dev:
  extends: .terraform_cloud
  environment:
    name: "dev"
  stage: apply
  variables:
    TF_STATE_NAME: "dev"
  script:
    - "terraform init -reconfigure"
    - "terraform apply -auto-approve tfplan"
  needs:
    - job: terraform_plan_dev
      artifacts: true
  allow_failure: false
  rules:
    - if: "$CI_COMMIT_REF_NAME !~ $DEPLOY_REF"
      when: never
    - when: manual

terraform_destroy_dev:
  extends: .terraform_cloud
  environment:
    name: "dev"
    action: stop
  stage: destroy
  variables:
    TF_STATE_NAME: "dev"
  script:
    - "terraform init -reconfigure"
    - "terraform destroy -auto-approve"
  needs: []
  rules:
    - if: "$CI_COMMIT_REF_NAME !~ $DEPLOY_REF"
      when: never
    - when: manual
